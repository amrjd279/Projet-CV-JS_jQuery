<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title></title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div id="wrapper">
        <header class="no-print">
            <h1 id="mon-nom">Amr Jaddad</h1>
            <div class="btns">
                <button id="dark-toggle" aria-label="Mode sombre" title="Basculer le mode sombre"><i class="fas fa-moon"></i></button>
                <button id="print-now" aria-label="Imprimer" title="Imprimer le CV"><i class="fas fa-print"></i></button>
            </div>
        </header>

        <main id="cv-card">
            <aside class="sidebar">
                <div class="photo-container">
                    <img src="IMG/Profil.jpg" alt="Portrait de Amr Jaddad">
                </div>
                
                <section class="side-block">
                    <h3>Contact</h3>
                    <div class="contact-item"><i class="fas fa-envelope"></i> amrjaddad2002@gmail.com</div>
                    <div class="contact-item"><i class="fas fa-phone"></i> +32 479 75 00 12</div>
                    <div class="contact-item"><i class="fab fa-linkedin"></i> <a href="https://www.linkedin.com/in/amr-jaddad-605737395/" target="_blank">LinkedIn</a></div>
                    <div class="contact-item"><i class="fab fa-github"></i> <a href="https://github.com/amrjd279" target="_blank">GitHub</a></div>

                </section>

                <section class="side-block">
                    <h3>Langues</h3>
                    <div class="skill-bar">
                        <div class="skill-info"><span>Français</span><span>100%</span></div>
                        <div class="bar-bg"><div class="bar-fill" data-percent="100%"></div></div>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-info"><span>Néerlandais</span><span>75%</span></div>
                        <div class="bar-bg"><div class="bar-fill" data-percent="75%"></div></div>
                    </div>
                </section>

                <section class="side-block">
                    <h3>Loisirs</h3>
                    <p style="font-size: 0.9rem; opacity: 0.9;"></p>
                </section>
            </aside>

            <div class="main-body">
                <article class="info-group">
                    <h2><i class="fas fa-user-circle"></i> Profil Professionnel</h2>
                    <p></p>
                </article>

                <article class="info-group">
                    <h2><i class="fas fa-code"></i> Compétences Techniques</h2>
                    <div class="skill-bar main-skill">
                        <div class="skill-info"><span>HTML5 / CSS3</span><span>90%</span></div>
                        <div class="bar-bg"><div class="bar-fill" data-percent="90%"></div></div>
                    </div>
                    <div class="skill-bar main-skill">
                        <div class="skill-info"><span>JavaScript / jQuery</span><span>70%</span></div>
                        <div class="bar-bg"><div class="bar-fill" data-percent="70%"></div></div>
                    </div>
                    <div class="skill-bar main-skill">
                        <div class="skill-info"><span>PHP / SQL</span><span>55%</span></div>
                        <div class="bar-bg"><div class="bar-fill" data-percent="55%"></div></div>
                    </div>
                </article>

                <article class="info-group">
                    <h2><i class="fas fa-briefcase"></i> Expériences</h2>
                    <div class="exp-item">
                        <div class="exp-row"><strong></strong> <time datetime=""></time></div>
                        <p class="company"></p>
                        <p class="desc"></p>
                    </div>
                    <div class="exp-item">
                        <div class="exp-row"><strong></strong> <time datetime=""></time></div>
                        <p class="company"></p>
                        <p class="desc"></p>
                    </div>
                </article>

                <article class="info-group">
                    <h2><i class="fas fa-graduation-cap"></i> Formation</h2>
                    <div class="exp-item">
                        <div class="exp-row"><strong></strong> <span></span></div>
                        <p></p>
                    </div>

            </div>
        </main>

        <footer class="no-print">
            <p>&copy;</p>
        </footer>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="JS/script.js"></script>
